<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>铜钱铺子 - 综合财务系统 V5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Sans SC', sans-serif;
        background-color: #F5F5F0;
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Animation */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "xlsx": "https://aistudiocdn.com/xlsx@^0.18.5",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react,typescript">
      import React, { useState, useEffect, useMemo } from 'react';
      import { createRoot } from 'react-dom/client';
      import * as XLSX from 'xlsx';
      import { 
        Briefcase, Calendar, ChevronLeft, ChevronRight, Download, Upload, 
        Settings, Coins, Lock, Archive, PlusCircle, Table, Trash2, 
        AlertTriangle, CheckCircle 
      } from 'lucide-react';
      import { 
        ResponsiveContainer, LineChart, Line, XAxis, YAxis, Tooltip, ReferenceLine 
      } from 'recharts';

      // --- Types ---
      interface Transaction {
        id: number;
        date: string; // ISO string YYYY-MM-DD
        type: 'income' | 'expense';
        amount: number;
        desc: string;
        source?: 'liquid' | 'reserve' | 'collection'; // For Copper Shop
      }

      interface CopperData {
        ratios: { liquid: number; reserve: number; collection: number; };
        balances: { liquid: number; reserve: number; collection: number; };
        transactions: Transaction[];
      }

      interface DailyData {
        dailyLimit: number;
        transactions: Transaction[];
      }

      enum ViewType {
        COPPER = 'copper',
        DAILY = 'daily'
      }

      // --- Utils ---
      const exportCopperToExcel = (data: CopperData) => {
        const wb = XLSX.utils.book_new();
        const wsData = data.transactions.map(t => ({
          日期: new Date(t.date).toLocaleDateString(),
          类型: t.type === 'income' ? '收入' : '支出',
          金额: t.amount,
          备注: t.desc,
          账户: t.source ? (t.source === 'liquid' ? '流动库' : t.source === 'reserve' ? '存储库' : '收藏库') : '-'
        }));
        const ws = XLSX.utils.json_to_sheet(wsData);
        XLSX.utils.book_append_sheet(wb, ws, "铜钱流水");

        const wsStatus = XLSX.utils.json_to_sheet([
          { 项目: "流动库", 金额: data.balances.liquid },
          { 项目: "存储库", 金额: data.balances.reserve },
          { 项目: "收藏库", 金额: data.balances.collection }
        ]);
        XLSX.utils.book_append_sheet(wb, wsStatus, "资产状态");
        XLSX.writeFile(wb, "铜钱生意账本.xlsx");
      };

      const exportDailyToExcel = (transactions: Transaction[], year: number, month: number) => {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(transactions.map(t => ({
          日期: t.date,
          类型: t.type === 'income' ? '收入' : '支出',
          金额: t.amount,
          备注: t.desc
        })));
        XLSX.utils.book_append_sheet(wb, ws, "记录");
        XLSX.writeFile(wb, `日常账本_${year}-${month}.xlsx`);
      };

      // --- Component: CopperShop ---
      const INITIAL_COPPER_DATA: CopperData = {
        ratios: { liquid: 70, reserve: 20, collection: 10 },
        balances: { liquid: 4.00, reserve: 100.00, collection: 6.00 },
        transactions: []
      };

      const CopperShop: React.FC = () => {
        const [data, setData] = useState<CopperData>(() => {
          const saved = localStorage.getItem('coinShopData_v5');
          return saved ? JSON.parse(saved) : INITIAL_COPPER_DATA;
        });

        const [showSettings, setShowSettings] = useState(false);
        const [form, setForm] = useState({ amount: '', desc: '', type: 'income', source: 'liquid' });

        useEffect(() => {
          localStorage.setItem('coinShopData_v5', JSON.stringify(data));
        }, [data]);

        const monthlyStats = useMemo(() => {
          const stats: Record<string, { income: number; expense: number }> = {};
          data.transactions.forEach(tx => {
            const monthKey = tx.date.substring(0, 7);
            if (!stats[monthKey]) stats[monthKey] = { income: 0, expense: 0 };
            if (tx.type === 'income') stats[monthKey].income += tx.amount;
            else stats[monthKey].expense += tx.amount;
          });

          return Object.entries(stats)
            .sort((a, b) => b[0].localeCompare(a[0]))
            .map(([month, { income, expense }]) => ({
              month, income, expense, net: income - expense
            }));
        }, [data.transactions]);

        const handleAddTransaction = () => {
          const amount = parseFloat(form.amount);
          if (!amount || amount <= 0) return alert("请输入有效金额");

          const newTx: Transaction = {
            id: Date.now(),
            date: new Date().toISOString(),
            type: form.type as 'income' | 'expense',
            amount,
            desc: form.desc || (form.type === 'income' ? '生意收入' : '生意支出'),
            source: form.type === 'expense' ? (form.source as any) : undefined
          };

          const newBalances = { ...data.balances };
          if (newTx.type === 'income') {
            newBalances.liquid += amount * (data.ratios.liquid / 100);
            newBalances.reserve += amount * (data.ratios.reserve / 100);
            newBalances.collection += amount * (data.ratios.collection / 100);
          } else {
            newBalances[form.source as keyof typeof newBalances] -= amount;
          }

          setData({
            ...data,
            balances: newBalances,
            transactions: [...data.transactions, newTx]
          });
          setForm({ ...form, amount: '', desc: '' });
        };

        const handleDeleteTransaction = (id: number) => {
          if (!window.confirm("确定删除这条记录吗？资金将自动回滚。")) return;
          const tx = data.transactions.find(t => t.id === id);
          if (!tx) return;

          const newBalances = { ...data.balances };
          if (tx.type === 'income') {
            newBalances.liquid -= tx.amount * (data.ratios.liquid / 100);
            newBalances.reserve -= tx.amount * (data.ratios.reserve / 100);
            newBalances.collection -= tx.amount * (data.ratios.collection / 100);
          } else {
            if (tx.source) newBalances[tx.source] += tx.amount;
          }

          setData({
            ...data,
            balances: newBalances,
            transactions: data.transactions.filter(t => t.id !== id)
          });
        };

        const handleSaveSettings = (r1: number, r2: number, r3: number) => {
          if (r1 + r2 + r3 !== 100) return alert("比例总和必须是100%");
          setData({ ...data, ratios: { liquid: r1, reserve: r2, collection: r3 } });
          setShowSettings(false);
        };

        const handleImport = (e: React.ChangeEvent<HTMLInputElement>) => {
          const file = e.target.files?.[0];
          if (!file) return;
          if (!window.confirm("确定覆盖现有数据吗？")) return;
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const wb = XLSX.read(evt.target?.result, { type: 'array' });
              const statusSheet = wb.Sheets["资产状态"];
              if(statusSheet) {
                const statusArr: any[] = XLSX.utils.sheet_to_json(statusSheet);
                const newBalances = { ...data.balances };
                statusArr.forEach(row => {
                  if (row['项目'] === "流动库") newBalances.liquid = Number(row['金额']);
                  if (row['项目'] === "存储库") newBalances.reserve = Number(row['金额']);
                  if (row['项目'] === "收藏库") newBalances.collection = Number(row['金额']);
                });
                setData({ ...data, balances: newBalances, transactions: [] });
                alert("导入成功 (仅恢复余额)");
              }
            } catch (err) { alert("导入失败"); }
          };
          reader.readAsArrayBuffer(file);
        };

        return (
          <div className="space-y-6 animate-fade-in">
            <div className="flex justify-between items-center border-b pb-4 border-stone-300">
              <h1 className="text-2xl font-bold text-amber-900 flex items-center gap-3">
                <div className="relative w-8 h-8">
                  <div className="absolute inset-0 bg-amber-700 rounded-full"></div>
                  <div className="absolute inset-2 bg-[#F5F5F0] rounded-sm"></div>
                </div>
                铜钱分账系统
              </h1>
              <button 
                onClick={() => setShowSettings(!showSettings)}
                className="flex items-center gap-2 px-3 py-1.5 text-stone-600 border border-stone-300 rounded hover:bg-stone-100 transition-colors"
              >
                <Settings size={16} /> 比例配置
              </button>
            </div>

            {showSettings && (
              <div className="bg-white p-6 rounded-xl shadow-lg border-t-4 border-stone-400">
                <h3 className="font-bold text-lg mb-4">配置比例 (总和须为100)</h3>
                <div className="grid grid-cols-3 gap-4 mb-4">
                  {['liquid', 'reserve', 'collection'].map((key, idx) => (
                    <div key={key}>
                      <label className="block text-sm text-stone-500 mb-1">{key === 'liquid' ? '流动' : key === 'reserve' ? '存储' : '收藏'}库 %</label>
                      <input type="number" defaultValue={(data.ratios as any)[key]} id={`r${idx+1}`} className="w-full p-2 border rounded" />
                    </div>
                  ))}
                </div>
                <button 
                  onClick={() => {
                    const r1 = Number((document.getElementById('r1') as HTMLInputElement).value);
                    const r2 = Number((document.getElementById('r2') as HTMLInputElement).value);
                    const r3 = Number((document.getElementById('r3') as HTMLInputElement).value);
                    handleSaveSettings(r1, r2, r3);
                  }}
                  className="w-full bg-amber-700 text-white py-2 rounded hover:bg-amber-800"
                >
                  保存配置
                </button>
                <div className="mt-4 pt-4 border-t flex gap-3">
                  <button onClick={() => exportCopperToExcel(data)} className="flex items-center gap-2 px-4 py-2 bg-blue-500 text-white rounded text-sm hover:bg-blue-600">
                    <Download size={16} /> 导出Excel
                  </button>
                  <label className="flex items-center gap-2 px-4 py-2 bg-stone-500 text-white rounded text-sm hover:bg-stone-600 cursor-pointer">
                    <Upload size={16} /> 导入Excel
                    <input type="file" hidden onChange={handleImport} accept=".xlsx,.xls" />
                  </label>
                </div>
              </div>
            )}

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {[
                { title: '流动库', key: 'liquid', icon: Coins, color: 'text-yellow-600', border: 'border-yellow-600' },
                { title: '存储库', key: 'reserve', icon: Lock, color: 'text-emerald-600', border: 'border-emerald-600' },
                { title: '收藏库', key: 'collection', icon: Archive, color: 'text-amber-900', border: 'border-amber-900' },
              ].map(item => (
                <div key={item.key} className={`bg-white p-6 rounded-xl shadow-md border-t-4 ${item.border} text-center`}>
                  <div className={`flex justify-center mb-2 ${item.color}`}><item.icon size={28} /></div>
                  <h3 className="font-bold text-stone-600">{item.title}</h3>
                  <div className="text-2xl font-bold mt-2">¥ {(data.balances as any)[item.key].toFixed(2)}</div>
                  <div className="text-xs text-stone-400 mt-1">占比 {(data.ratios as any)[item.key]}%</div>
                </div>
              ))}
            </div>

            <div className="bg-white p-6 rounded-xl shadow-md">
              <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><PlusCircle size={20} className="text-amber-700"/> 生意记账</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <select 
                  value={form.type} onChange={e => setForm({...form, type: e.target.value})}
                  className="p-3 border rounded-lg bg-stone-50"
                >
                  <option value="income">收入 (自动分账)</option>
                  <option value="expense">支出</option>
                </select>
                {form.type === 'expense' && (
                  <select 
                    value={form.source} onChange={e => setForm({...form, source: e.target.value})}
                    className="p-3 border rounded-lg bg-stone-50"
                  >
                    <option value="liquid">从 流动库 扣款</option>
                    <option value="reserve">从 存储库 扣款</option>
                    <option value="collection">从 收藏库 扣款</option>
                  </select>
                )}
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <input 
                  type="number" placeholder="金额" value={form.amount}
                  onChange={e => setForm({...form, amount: e.target.value})}
                  className="p-3 border rounded-lg text-lg"
                />
                <input 
                  type="text" placeholder="备注" value={form.desc}
                  onChange={e => setForm({...form, desc: e.target.value})}
                  className="p-3 border rounded-lg"
                />
              </div>
              <button onClick={handleAddTransaction} className="w-full py-3 bg-amber-700 hover:bg-amber-800 text-white font-bold rounded-lg transition-colors">确认提交</button>
            </div>

            {monthlyStats.length > 0 && (
              <div className="bg-white rounded-xl shadow-md overflow-hidden">
                <div className="p-4 border-b border-stone-200 bg-stone-50 flex items-center gap-2">
                  <Table size={18} className="text-stone-500" />
                  <h3 className="font-bold text-stone-700">月度收支汇总</h3>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm text-left">
                    <thead className="bg-stone-50 text-stone-500 font-medium">
                      <tr>
                        <th className="px-4 py-3">月份</th>
                        <th className="px-4 py-3 text-emerald-600">总收入</th>
                        <th className="px-4 py-3 text-red-500">总支出</th>
                        <th className="px-4 py-3 text-right">净收益</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-stone-100">
                      {monthlyStats.map((stat) => (
                        <tr key={stat.month} className="hover:bg-stone-50 transition-colors">
                          <td className="px-4 py-3 font-medium text-stone-700">{stat.month}</td>
                          <td className="px-4 py-3 text-emerald-600">+{stat.income.toFixed(2)}</td>
                          <td className="px-4 py-3 text-red-500">-{stat.expense.toFixed(2)}</td>
                          <td className={`px-4 py-3 text-right font-bold ${stat.net >= 0 ? 'text-emerald-700' : 'text-red-700'}`}>
                            {stat.net >= 0 ? '+' : ''}{stat.net.toFixed(2)}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            <div>
              <h2 className="text-lg font-bold text-stone-700 mb-3">📜 近期生意流水</h2>
              <ul className="space-y-3">
                {[...data.transactions].reverse().slice(0, 10).map((tx) => (
                  <li key={tx.id} className="bg-white p-4 rounded-lg shadow-sm flex justify-between items-center border-l-4 border-stone-200 group">
                    <div>
                      <div className="font-medium text-stone-800">{tx.desc}</div>
                      <div className="text-xs text-stone-400">
                        {new Date(tx.date).toLocaleDateString()} 
                        {tx.type === 'expense' && <span className="ml-2 px-1 bg-stone-100 rounded text-stone-500">{tx.source === 'liquid' ? '流动' : tx.source === 'reserve' ? '存储' : '收藏'}</span>}
                      </div>
                    </div>
                    <div className="flex items-center gap-3">
                      <div className={`text-lg font-bold ${tx.type === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>
                        {tx.type === 'income' ? '+' : '-'}{tx.amount.toFixed(2)}
                      </div>
                      <button 
                        onClick={() => handleDeleteTransaction(tx.id)}
                        className="text-stone-300 hover:text-red-500 p-1 rounded transition-colors opacity-0 group-hover:opacity-100"
                      >
                        <Trash2 size={18} />
                      </button>
                    </div>
                  </li>
                ))}
                {data.transactions.length === 0 && <li className="text-center text-stone-400 py-4">暂无记录</li>}
              </ul>
            </div>
          </div>
        );
      };

      // --- Component: DailyLedger ---
      const INITIAL_DAILY_DATA: DailyData = {
        dailyLimit: 30, // Updated default limit to 30
        transactions: []
      };

      const DailyLedger: React.FC = () => {
        const [data, setData] = useState<DailyData>(() => {
          const saved = localStorage.getItem('dailyBookData_v5');
          return saved ? JSON.parse(saved) : INITIAL_DAILY_DATA;
        });

        const today = new Date();
        const [currentYear, setCurrentYear] = useState(today.getFullYear());
        const [currentMonth, setCurrentMonth] = useState(today.getMonth() + 1);
        const [pickerYear, setPickerYear] = useState(today.getFullYear());
        const [showPicker, setShowPicker] = useState(false);

        const [form, setForm] = useState({ 
          amount: '', desc: '', type: 'expense', date: today.toISOString().split('T')[0] 
        });

        useEffect(() => {
          localStorage.setItem('dailyBookData_v5', JSON.stringify(data));
        }, [data]);

        const monthTransactions = useMemo(() => {
          const prefix = `${currentYear}-${currentMonth.toString().padStart(2, '0')}`;
          return data.transactions.filter(t => t.date.startsWith(prefix));
        }, [data.transactions, currentYear, currentMonth]);

        const { income, expense, balance } = useMemo(() => {
          let inc = 0, exp = 0;
          monthTransactions.forEach(t => t.type === 'income' ? inc += t.amount : exp += t.amount);
          return { income: inc, expense: exp, balance: inc - exp };
        }, [monthTransactions]);

        const todaySpent = useMemo(() => {
          const todayStr = new Date().toISOString().split('T')[0];
          return data.transactions
            .filter(t => t.type === 'expense' && t.date === todayStr)
            .reduce((acc, t) => acc + t.amount, 0);
        }, [data.transactions]);

        const chartData = useMemo(() => {
          const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
          const map = new Map<number, number>();
          for(let i=1; i<=daysInMonth; i++) map.set(i, 0);
          monthTransactions.forEach(t => {
            if (t.type === 'expense') {
              const d = parseInt(t.date.split('-')[2]);
              map.set(d, (map.get(d) || 0) + t.amount);
            }
          });
          return Array.from(map.entries()).map(([day, amount]) => ({ day, amount }));
        }, [monthTransactions, currentYear, currentMonth]);

        const handleAddTx = () => {
          const amount = parseFloat(form.amount);
          if (!amount || !form.date) return alert("请完善信息");
          const newTx: Transaction = {
            id: Date.now(),
            date: form.date,
            type: form.type as 'income' | 'expense',
            amount,
            desc: form.desc || (form.type === 'expense' ? '日常支出' : '额外收入')
          };
          setData(prev => ({ ...prev, transactions: [...prev.transactions, newTx] }));
          const d = new Date(form.date);
          setCurrentYear(d.getFullYear());
          setCurrentMonth(d.getMonth() + 1);
          setForm(prev => ({ ...prev, amount: '', desc: '' }));
        };

        const handleDeleteTx = (id: number) => {
          if (!window.confirm("确定删除这条记录吗？")) return;
          setData(prev => ({
            ...prev,
            transactions: prev.transactions.filter(t => t.id !== id)
          }));
        };

        const calculateMonthBalanceForPicker = (year: number, month: number) => {
          const prefix = `${year}-${month.toString().padStart(2, '0')}`;
          let bal = 0;
          let hasTx = false;
          data.transactions.forEach(t => {
            if (t.date.startsWith(prefix)) {
              hasTx = true;
              if (t.type === 'income') bal += t.amount;
              else bal -= t.amount;
            }
          });
          return { bal, hasTx };
        };

        const handleImport = (e: React.ChangeEvent<HTMLInputElement>) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
              try {
                const wb = XLSX.read(evt.target?.result, {type: 'array'});
                const jsonData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                const newTxs = jsonData.map((r: any) => ({ 
                  id: Date.now() + Math.random(), 
                  date: r['日期'] || r['date'], 
                  type: r['类型'] === '收入' ? 'income' : 'expense', 
                  amount: Number(r['金额']), 
                  desc: r['备注'] 
                }));
                setData(prev => ({...prev, transactions: [...prev.transactions, ...newTxs]}));
                alert("导入成功");
              } catch(err) { alert("导入失败"); }
            };
            reader.readAsArrayBuffer(file);
        };

        return (
          <div className="space-y-6 animate-fade-in relative">
            <div className="flex justify-between items-center border-b pb-4 border-blue-200">
              <h1 className="text-2xl font-bold text-blue-700 flex items-center gap-3">
                 <Calendar className="text-blue-500" />
                 日常月度账本
              </h1>
            </div>

            <div className="relative z-20">
              <div 
                onClick={() => setShowPicker(!showPicker)}
                className="bg-blue-50 border border-blue-100 rounded-xl p-4 flex justify-between items-center cursor-pointer hover:bg-blue-100 transition-colors select-none"
              >
                <div className="flex items-center gap-2 text-xl font-bold text-blue-800">
                   {currentYear}年{currentMonth}月 <span className="text-xs align-middle">▼</span>
                </div>
                <div className="text-right">
                   <div className="text-xs text-blue-400">本月结余</div>
                   <div className={`font-bold text-lg ${balance >= 0 ? 'text-emerald-600' : 'text-red-500'}`}>
                      {balance >= 0 ? '+' : ''}{balance.toFixed(2)}
                   </div>
                </div>
              </div>

              {showPicker && (
                <div className="absolute top-full left-0 right-0 mt-2 bg-white border border-stone-200 shadow-2xl rounded-xl p-4 z-50">
                  <div className="flex justify-between items-center mb-4">
                    <button onClick={() => setPickerYear(p => p - 1)} className="p-1 hover:bg-stone-100 rounded"><ChevronLeft /></button>
                    <span className="font-bold text-lg">{pickerYear}</span>
                    <button onClick={() => setPickerYear(p => p + 1)} className="p-1 hover:bg-stone-100 rounded"><ChevronRight /></button>
                  </div>
                  <div className="grid grid-cols-4 gap-2">
                    {Array.from({ length: 12 }, (_, i) => i + 1).map(m => {
                      const { bal, hasTx } = calculateMonthBalanceForPicker(pickerYear, m);
                      const isActive = pickerYear === currentYear && m === currentMonth;
                      let badgeStyle = '';
                      if (isActive) badgeStyle = 'bg-white/20 text-white';
                      else if (!hasTx) badgeStyle = 'bg-stone-100 text-stone-400';
                      else if (bal >= 0) badgeStyle = 'bg-emerald-100 text-emerald-700';
                      else badgeStyle = 'bg-red-100 text-red-700';

                      return (
                        <div 
                          key={m}
                          onClick={() => { setCurrentYear(pickerYear); setCurrentMonth(m); setShowPicker(false); }}
                          className={`
                            flex flex-col items-center justify-center p-2 rounded-lg cursor-pointer border transition-all
                            ${isActive ? 'bg-blue-500 text-white border-blue-600' : 'bg-white hover:bg-stone-50 border-transparent'}
                          `}
                        >
                          <span className="font-bold text-sm">{m}月</span>
                          <span className={`text-[10px] px-1.5 rounded-full mt-1 ${badgeStyle}`}>
                             {!hasTx ? '无记录' : (bal > 0 ? '+' : '') + bal.toFixed(0)}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-white p-5 rounded-xl shadow-sm border border-stone-100">
                 <h3 className="text-stone-500 font-bold text-sm mb-3">📊 收支概览</h3>
                 <div className="flex justify-between items-end">
                   <div>
                      <div className="text-xs text-stone-400">总收入</div>
                      <div className="text-xl font-bold text-emerald-600">+{income.toFixed(2)}</div>
                   </div>
                   <div className="text-right">
                      <div className="text-xs text-stone-400">总支出</div>
                      <div className="text-xl font-bold text-red-500">-{expense.toFixed(2)}</div>
                   </div>
                 </div>
              </div>
              <div className="bg-white p-5 rounded-xl shadow-sm border border-stone-100">
                <h3 className="text-stone-500 font-bold text-sm mb-2">⚡ 今日额度监控</h3>
                <div className="flex justify-between items-center">
                  <div>
                    <span className="text-2xl font-bold text-stone-800">{todaySpent.toFixed(2)}</span>
                    <span className="text-stone-400 text-sm ml-2">/ 今日已用</span>
                  </div>
                  <div className={`flex items-center gap-1 text-sm font-bold ${todaySpent > data.dailyLimit ? 'text-red-500' : 'text-emerald-600'}`}>
                    {todaySpent > data.dailyLimit ? <AlertTriangle size={16}/> : <CheckCircle size={16}/>}
                    {todaySpent > data.dailyLimit ? '严重超支' : '状态正常'}
                  </div>
                </div>
                <div className="mt-3 flex items-center gap-2 text-sm text-stone-500">
                  <span>设定限额:</span>
                  <input 
                    type="number" value={data.dailyLimit} 
                    onChange={(e) => setData(prev => ({...prev, dailyLimit: Number(e.target.value)}))}
                    className="w-20 border rounded px-2 py-1 bg-stone-50" 
                  />
                </div>
              </div>
            </div>

            <div className="bg-white p-4 rounded-xl shadow-sm border border-stone-100 h-64">
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={chartData}>
                   <XAxis dataKey="day" axisLine={false} tickLine={false} tick={{fill: '#9CA3AF', fontSize: 12}} />
                   <YAxis axisLine={false} tickLine={false} tick={{fill: '#9CA3AF', fontSize: 12}} />
                   <Tooltip contentStyle={{borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)'}} />
                   <ReferenceLine y={data.dailyLimit} stroke="red" strokeDasharray="3 3" />
                   <Line type="monotone" dataKey="amount" stroke="#4A90E2" strokeWidth={2} dot={false} activeDot={{r: 6}} />
                </LineChart>
              </ResponsiveContainer>
            </div>

            <div className="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-500">
              <h3 className="font-bold text-stone-700 mb-4">📝 记一笔</h3>
              <div className="grid grid-cols-2 gap-4 mb-3">
                <select 
                  value={form.type} onChange={e => setForm({...form, type: e.target.value})} 
                  className="p-2 border rounded bg-stone-50"
                >
                  <option value="expense">支出</option>
                  <option value="income">收入</option>
                </select>
                <input 
                  type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} 
                  className="p-2 border rounded bg-stone-50"
                />
              </div>
              <div className="space-y-3">
                <input 
                  type="number" placeholder="金额" value={form.amount} 
                  onChange={e => setForm({...form, amount: e.target.value})} 
                  className="w-full p-2 border rounded text-lg"
                />
                <input 
                  type="text" placeholder="备注" value={form.desc} 
                  onChange={e => setForm({...form, desc: e.target.value})} 
                  className="w-full p-2 border rounded"
                />
                <button onClick={handleAddTx} className="w-full py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition-colors">提交</button>
              </div>
            </div>
            
            <div className="flex gap-4 pt-4 border-t border-stone-200">
               <button onClick={() => exportDailyToExcel(monthTransactions, currentYear, currentMonth)} className="flex items-center gap-2 px-4 py-2 text-sm text-stone-600 bg-white border rounded hover:bg-stone-50">
                 <Download size={16}/> 导出该月Excel
               </button>
               <label className="flex items-center gap-2 px-4 py-2 text-sm text-stone-600 bg-white border rounded hover:bg-stone-50 cursor-pointer">
                 <Upload size={16}/> 导入Excel
                 <input type="file" hidden onChange={handleImport} accept=".xlsx,.xls" />
               </label>
            </div>

            <div className="pb-10">
              <h3 className="font-bold text-stone-500 text-sm mb-2">本月明细</h3>
              <ul className="space-y-2">
                {[...monthTransactions].reverse().map(tx => (
                  <li key={tx.id} className="flex justify-between items-center bg-white p-3 rounded shadow-sm group">
                     <div>
                        <div className="text-stone-800 font-medium">{tx.desc}</div>
                        <div className="text-xs text-stone-400">{tx.date}</div>
                     </div>
                     <div className="flex items-center gap-3">
                         <div className={`font-bold ${tx.type === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>
                           {tx.type === 'income' ? '+' : '-'}{tx.amount.toFixed(2)}
                         </div>
                         <button 
                            onClick={() => handleDeleteTx(tx.id)}
                            className="text-stone-300 hover:text-red-500 p-1 rounded transition-colors opacity-0 group-hover:opacity-100"
                          >
                            <Trash2 size={16} />
                         </button>
                     </div>
                  </li>
                ))}
                {monthTransactions.length === 0 && <li className="text-center text-stone-400 text-sm py-4">本月暂无记录</li>}
              </ul>
            </div>
          </div>
        );
      };

      // --- Component: App ---
      const App: React.FC = () => {
        const [currentView, setCurrentView] = useState<ViewType>(ViewType.DAILY); // Default to Daily
        const [isSidebarOpen, setSidebarOpen] = useState(false);

        return (
          <div className="flex min-h-screen bg-[#F5F5F0] text-stone-800">
            <nav 
              className={`fixed md:relative z-30 h-full bg-[#2c3e50] text-stone-300 transition-all duration-300 flex flex-col pt-8
                ${isSidebarOpen ? 'w-48' : 'w-[80px] hidden md:flex'}
              `}
              onMouseEnter={() => setSidebarOpen(true)}
              onMouseLeave={() => setSidebarOpen(false)}
            >
              <div 
                onClick={() => setCurrentView(ViewType.COPPER)}
                className={`
                  cursor-pointer p-4 flex flex-col items-center gap-2 transition-colors relative
                  ${currentView === ViewType.COPPER ? 'bg-[#34495e] text-white' : 'hover:bg-[#34495e] hover:text-white'}
                `}
              >
                {currentView === ViewType.COPPER && <div className="absolute left-0 top-0 bottom-0 w-1 bg-amber-600"></div>}
                <Briefcase size={24} />
                <span className={`text-xs whitespace-nowrap overflow-hidden transition-opacity duration-200 ${isSidebarOpen ? 'opacity-100' : 'opacity-0 md:opacity-100'}`}>
                  铜钱生意
                </span>
              </div>
              <div 
                onClick={() => setCurrentView(ViewType.DAILY)}
                className={`
                  cursor-pointer p-4 flex flex-col items-center gap-2 transition-colors relative
                  ${currentView === ViewType.DAILY ? 'bg-[#34495e] text-white' : 'hover:bg-[#34495e] hover:text-white'}
                `}
              >
                {currentView === ViewType.DAILY && <div className="absolute left-0 top-0 bottom-0 w-1 bg-blue-500"></div>}
                <Calendar size={24} />
                <span className={`text-xs whitespace-nowrap overflow-hidden transition-opacity duration-200 ${isSidebarOpen ? 'opacity-100' : 'opacity-0 md:opacity-100'}`}>
                  日常账本
                </span>
              </div>
            </nav>

            <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-[#2c3e50] text-stone-300 flex justify-around z-40 pb-safe">
               <div 
                onClick={() => setCurrentView(ViewType.COPPER)}
                className={`flex-1 p-3 text-center ${currentView === ViewType.COPPER ? 'text-white bg-[#34495e]' : ''}`}
              >
                <div className="flex flex-col items-center"><Briefcase size={20} /><span className="text-xs mt-1">铜钱生意</span></div>
              </div>
              <div 
                onClick={() => setCurrentView(ViewType.DAILY)}
                className={`flex-1 p-3 text-center ${currentView === ViewType.DAILY ? 'text-white bg-[#34495e]' : ''}`}
              >
                <div className="flex flex-col items-center"><Calendar size={20} /><span className="text-xs mt-1">日常账本</span></div>
              </div>
            </nav>

            <main className="flex-1 p-4 md:p-8 max-w-4xl mx-auto w-full pb-20 md:pb-8 overflow-y-auto h-screen scrollbar-hide">
              {currentView === ViewType.COPPER ? <CopperShop /> : <DailyLedger />}
            </main>
          </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
